<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="game-version" content="0.4.0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Conflict of Nations: World War 3 — клон</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230e2740' stroke='%23f0a830' stroke-width='2'/%3E%3Cpath d='M7 12l5-3 4 2 5-1 4 4-3 3-4-1-3 4-3-1-2-4z' fill='%235b8def'/%3E%3Ccircle cx='21' cy='20' r='4' fill='%23e0503c'/%3E%3C/svg%3E">
<style>
:root{--bg:#0a1420;--bg2:#101f30;--bg3:#16293e;--line:#27415c;--acc:#f0a830;--acc2:#ffd27a;--tx:#dde7f1;--tx2:#8fa6bd;--ok:#5fd35f;--bad:#e0503c;--warn:#e6c34a;--blue:#4a90e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06101a;color:var(--tx);font:13px/1.35 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;user-select:none;-webkit-user-select:none}
#map-wrap{position:fixed;inset:0;background:#0e2740}
#map{display:block;touch-action:none;cursor:grab}
#map.order{cursor:crosshair}
.hidden{display:none!important}
button{font:inherit;color:var(--tx);cursor:pointer}
.btn{background:linear-gradient(#233a54,#182b40);border:1px solid #35516f;border-radius:4px;padding:5px 10px;color:var(--tx);transition:.12s}
.btn:hover:not(:disabled){border-color:var(--acc);color:#fff;background:linear-gradient(#2c4968,#1d3550)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:linear-gradient(#e9a130,#b87614);border-color:#ffd27a;color:#1a1000;font-weight:700}
.btn.pri:hover:not(:disabled){background:linear-gradient(#ffb840,#c98418);color:#000}
.btn.danger{background:linear-gradient(#8e2f24,#611d16);border-color:#d3604f}
.btn.sm{padding:2px 7px;font-size:12px}
.flag{width:24px;height:16px;border:1px solid rgba(0,0,0,.6);border-radius:2px;vertical-align:middle;object-fit:cover}
.flag.lg{width:44px;height:29px}
.uico{vertical-align:middle}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#topbar{position:absolute;left:0;right:0;top:0;height:44px;background:linear-gradient(#142335,#0c1927);border-bottom:1px solid #2c4a68;display:flex;align-items:center;gap:6px;padding:0 6px;box-shadow:0 2px 10px rgba(0,0,0,.5);z-index:5}
#tb-country{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 4px;border-radius:4px;cursor:pointer;min-width:150px;border:1px solid transparent}
#tb-country:hover{border-color:var(--acc)}
#tb-country b{font-size:14px;display:block;line-height:1.1}
#tb-country small{color:var(--tx2);font-size:11px}
#tb-time{text-align:center;min-width:104px;line-height:1.15}
#tb-time b{font-size:14px;letter-spacing:.5px}#tb-time small{color:var(--tx2)}
#tb-speed{display:flex;gap:2px}
#tb-speed button{width:28px;height:28px;border:1px solid #35516f;background:#16273a;border-radius:3px;padding:0;font-size:12px}
#tb-speed button.on{background:var(--acc);color:#1a1000;border-color:var(--acc2)}
#tb-res{display:flex;gap:3px;flex:1;overflow-x:auto;scrollbar-width:none}
#tb-res::-webkit-scrollbar{display:none}
.rchip{display:flex;align-items:center;gap:4px;background:#0f1d2d;border:1px solid #223b55;border-radius:4px;padding:2px 7px;white-space:nowrap;min-width:78px;cursor:pointer}
.rchip:hover{border-color:var(--acc)}
.rchip .v{font-weight:700;font-size:13px;line-height:1.05}.rchip .d{font-size:10.5px;line-height:1}
.rchip .pos{color:var(--ok)}.rchip .neg{color:var(--bad)}
.rchip.low .v{color:var(--bad)}
#tb-right{display:flex;gap:4px}
.ibtn{width:34px;height:32px;border:1px solid #35516f;background:#16273a;border-radius:4px;font-size:16px;padding:0;position:relative}
.ibtn:hover{border-color:var(--acc)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:9px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px}
#leftbar{position:absolute;left:0;top:44px;bottom:0;width:52px;background:linear-gradient(90deg,#0b1724,#0e1c2b);border-right:1px solid #223b55;display:flex;flex-direction:column;padding:6px 4px;gap:4px;z-index:4}
#leftbar button{width:44px;height:46px;border:1px solid transparent;background:transparent;border-radius:5px;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
#leftbar button span{font-size:8.5px;color:var(--tx2);margin-top:3px;letter-spacing:.2px}
#leftbar button:hover{background:#17293d;border-color:#35516f}
#leftbar button.on{background:#1d3550;border-color:var(--acc)}
.panel{position:absolute;background:linear-gradient(#10202f,#0b1825);border:1px solid #2c4a68;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.6);z-index:3}
#goals{left:60px;top:52px;width:250px;padding:6px 9px;font-size:12px;background:rgba(10,22,34,.86);cursor:pointer}
#goals h5{margin:0 0 4px;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--acc2);display:flex;justify-content:space-between}
#goals .g{display:flex;gap:6px;padding:2px 0;color:var(--tx)}#goals .g.done{color:var(--tx2);text-decoration:line-through}
#goals.min .g{display:none}
#prov-panel{right:8px;top:52px;width:338px;max-height:calc(100% - 262px);overflow:auto}
#prov-panel::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:7px;height:7px}
#prov-panel::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:#2c4a68;border-radius:4px}
.ph{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #223b55;background:linear-gradient(#17304a,#10243a);position:sticky;top:0;z-index:2}
.ph h3{margin:0;font-size:15px;flex:1;line-height:1.15}
.ph small{color:var(--tx2);display:block;font-size:11px}
.ph .x{width:24px;height:24px;padding:0;border:0;background:transparent;font-size:16px;color:var(--tx2)}
.ph .x:hover{color:#fff}
.sec{padding:7px 10px;border-bottom:1px solid #1b3047}
.sec h4{margin:0 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--tx2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.kv{display:flex;justify-content:space-between;gap:6px}.kv span:first-child{color:var(--tx2)}
.bldgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.bld{background:#0f1e2f;border:1px solid #223b55;border-radius:4px;padding:4px 6px;display:flex;flex-direction:column;gap:3px;position:relative}
.bld:hover{border-color:#3a5d82}
.bld .t{display:flex;align-items:center;gap:5px;font-size:12px}
.bld .pips{display:flex;gap:2px}.pip{width:9px;height:6px;background:#1f3349;border-radius:1px}.pip.on{background:var(--acc)}
.bld .bar{height:4px;background:#1f3349;border-radius:2px;overflow:hidden}.bld .bar i{display:block;height:100%;background:var(--ok)}
.bld .go{position:absolute;right:4px;top:4px}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ubtn{display:flex;align-items:center;gap:6px;background:#0f1e2f;border:1px solid #223b55;border-radius:4px;padding:3px 6px;text-align:left;font-size:12px;width:100%}
.ubtn:hover:not(:disabled){border-color:var(--acc)}
.ubtn:disabled{opacity:.4}
.ubtn small{display:block;color:var(--tx2);font-size:10px}
.costs{display:inline-flex;gap:5px;flex-wrap:wrap;font-size:11px}.costs i{font-style:normal;white-space:nowrap}.costs .no{color:var(--bad)}
.q{display:flex;align-items:center;gap:6px;margin:2px 0;font-size:12px}.q .bar{flex:1;height:5px;background:#1f3349;border-radius:3px;overflow:hidden}.q .bar i{display:block;height:100%;background:var(--blue)}
.ulist{display:flex;flex-wrap:wrap;gap:4px}
.uchip{display:flex;align-items:center;gap:4px;padding:2px 6px;background:#12263a;border:1px solid #2a4562;border-radius:4px;cursor:pointer;font-size:12px}
.uchip:hover{border-color:var(--acc)}.uchip.sel{border-color:var(--acc2);background:#2a3d20}
.hp{display:inline-block;width:26px;height:4px;background:#243a52;border-radius:2px;vertical-align:middle;overflow:hidden}.hp i{display:block;height:100%}
#unit-panel{left:330px;bottom:30px;width:min(620px,calc(100% - 700px));min-width:330px;padding:0}
#unit-panel .body{padding:7px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;max-height:150px;overflow:auto}
#unit-panel .acts{padding:6px 10px;border-top:1px solid #1b3047;display:flex;flex-wrap:wrap;gap:5px}
.card{display:flex;gap:6px;align-items:center;background:#12263a;border:1px solid #2a4562;border-radius:5px;padding:3px 7px;flex:0 0 auto}
#mini-wrap{position:absolute;left:58px;bottom:6px;z-index:4;display:none}
#mini{display:block;border:2px solid #2c4a68;border-radius:3px;width:230px;height:auto;background:#0e2740;box-shadow:0 2px 10px rgba(0,0,0,.6)}
#mapmodes{position:absolute;right:-34px;bottom:0;display:flex;flex-direction:column;gap:2px}
#mapmodes button{width:26px;height:24px;font-size:13px;padding:0;background:#16273a;border:1px solid #35516f;border-radius:3px}
#mapmodes button.on{border-color:var(--acc);background:#2a4262}
#tut{left:50%;transform:translateX(-50%);top:52px;width:min(560px,calc(100% - 20px));padding:10px 14px;background:linear-gradient(#26405c,#16293e);border:2px solid var(--acc);z-index:12;box-shadow:0 8px 30px rgba(0,0,0,.7)}
#tut h5{margin:0 0 4px;font-size:11px;letter-spacing:1px;color:var(--acc2);text-transform:uppercase}#tut p{margin:0 0 8px;font-size:14px;line-height:1.4}
.tuthl{outline:3px solid #ffd27a!important;outline-offset:2px;box-shadow:0 0 16px 5px rgba(255,210,122,.85)!important;animation:tpulse 1s infinite alternate;position:relative;z-index:6}
@keyframes tpulse{from{box-shadow:0 0 6px 2px rgba(255,210,122,.5)}to{box-shadow:0 0 20px 7px rgba(255,210,122,.95)}}
#legend{left:330px;bottom:30px;padding:6px 10px;font-size:11.5px;min-width:190px;background:rgba(10,22,34,.9);pointer-events:none}
#legend .lg{display:flex;align-items:center;gap:6px;margin:2px 0}#legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
#legend .grad{height:8px;border-radius:4px;margin:4px 0 2px}
#ticker{position:absolute;left:330px;right:360px;bottom:4px;height:22px;background:rgba(8,16,26,.8);border:1px solid #223b55;border-radius:11px;padding:0 12px;line-height:20px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-size:12px;z-index:4}
#toasts{position:absolute;top:170px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;z-index:9;max-width:70%}
.toast{background:rgba(10,22,34,.94);border:1px solid #35516f;border-left:4px solid var(--acc);border-radius:4px;padding:6px 12px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:tin .25s;pointer-events:auto;cursor:pointer}
.toast.war{border-left-color:var(--bad)}.toast.good{border-left-color:var(--ok)}.toast.nuke{border-color:#ffdf3a;border-left-color:#ff3a1a;background:rgba(60,10,6,.95);font-weight:700}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#order-hint{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(240,168,48,.95);color:#1a1000;padding:5px 14px;border-radius:14px;font-weight:700;z-index:8;pointer-events:none}
#tooltip{position:fixed;z-index:50;background:rgba(7,15,24,.97);border:1px solid #3a5d82;border-radius:5px;padding:6px 9px;font-size:12px;max-width:300px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.6)}
/* modal */
#modal-back{position:fixed;inset:0;background:rgba(2,8,14,.62);z-index:20;display:flex;align-items:center;justify-content:center}
#modal{background:linear-gradient(#112133,#0a1622);border:1px solid #3a5d82;border-radius:8px;box-shadow:0 10px 50px rgba(0,0,0,.8);width:min(1080px,96vw);height:min(660px,92vh);display:flex;flex-direction:column;overflow:hidden}
#modal.sm{width:min(520px,94vw);height:auto;max-height:90vh}
.mh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(#1a3550,#122840);border-bottom:1px solid #2c4a68}
.mh h2{margin:0;font-size:17px;flex:1;letter-spacing:.5px}
.tabs{display:flex;gap:2px;padding:6px 10px 0;background:#0d1b2a;border-bottom:1px solid #223b55;overflow-x:auto}
.tabs button{background:transparent;border:1px solid transparent;border-bottom:0;padding:6px 14px;border-radius:5px 5px 0 0;color:var(--tx2);white-space:nowrap}
.tabs button.on{background:#16293e;color:#fff;border-color:#2c4a68}
.mb{flex:1;overflow:auto;padding:12px 14px}
.row{display:flex;gap:10px;align-items:center}
table.t{border-collapse:collapse;width:100%}
table.t th{text-align:left;color:var(--tx2);font-weight:600;font-size:11px;text-transform:uppercase;padding:4px 8px;border-bottom:1px solid #27415c;position:sticky;top:0;background:#0f1e2f;cursor:pointer}
table.t td{padding:4px 8px;border-bottom:1px solid #16293e}
table.t tr:hover td{background:#14283c}
table.t tr.me td{background:#1c3a24}
.bar2{height:7px;background:#1f3349;border-radius:4px;overflow:hidden;min-width:60px}.bar2 i{display:block;height:100%}
.cols{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;min-width:1000px}
.col h4{margin:0 0 6px;color:var(--acc2);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.rcard{background:#102033;border:1px solid #223b55;border-radius:5px;padding:7px;margin-bottom:6px;font-size:12px}
.rcard:hover{border-color:#3a5d82}
.rcard .tt{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:3px}
.rcard p{margin:3px 0;color:var(--tx2);font-size:11.5px}
.rcur{background:#142b44;border:1px solid var(--blue)}
.split{display:grid;grid-template-columns:300px 1fr;gap:12px;height:100%}
.split>div{min-height:0;overflow:auto}
.dlist .it{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.dlist .it:hover{background:#16293e}.dlist .it.on{background:#1d3550;border-color:var(--acc)}
.relbar{width:54px}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;background:#1f3349}
.pill.war{background:#7a2219}.pill.ally{background:#1e5a3a}.pill.acc{background:#35516f}
input[type=text],input[type=number],select{background:#0b1724;border:1px solid #35516f;border-radius:4px;color:var(--tx);padding:5px 8px;font:inherit;user-select:text;-webkit-user-select:text}
input[type=range]{accent-color:var(--acc)}
/* start screen */
#start{position:fixed;inset:0;z-index:30;display:flex;pointer-events:none}
#start>*{pointer-events:auto}
.stl{width:min(430px,100%);background:linear-gradient(90deg,rgba(6,14,22,.97),rgba(8,18,28,.9));border-right:1px solid #2c4a68;padding:18px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.logo{font-size:12px;letter-spacing:5px;color:var(--acc);margin:0}
.title{font-size:30px;font-weight:800;line-height:1.02;margin:2px 0;letter-spacing:1px;text-shadow:0 2px 12px rgba(240,168,48,.35)}
.title em{font-style:normal;color:var(--acc)}
.str{margin-left:auto;width:min(380px,100%);background:linear-gradient(270deg,rgba(6,14,22,.96),rgba(8,18,28,.88));border-left:1px solid #2c4a68;padding:18px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.clist{flex:0 0 auto;min-height:130px;max-height:260px;overflow:auto;border:1px solid #223b55;border-radius:5px;background:#0a1521}
.clist .it{display:flex;align-items:center;gap:8px;padding:4px 8px;cursor:pointer}
.clist .it:hover{background:#16293e}.clist .it.on{background:#24425f}
.cardc{background:#0e1d2d;border:1px solid #2c4a68;border-radius:6px;padding:10px}
.stars{color:var(--acc);letter-spacing:1px}.stars s{color:#2c4058;text-decoration:none}
.opt{display:flex;gap:6px;flex-wrap:wrap}.opt button{flex:1;min-width:90px}.opt button.on{background:var(--acc);color:#1a1000;border-color:var(--acc2);font-weight:700}
.note{color:var(--tx2);font-size:11.5px}
.over{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center}
.over h1{font-size:46px;margin:0;letter-spacing:4px}
@media (max-width:900px){
 #unit-panel{left:330px;width:auto;right:360px;min-width:0}
}
@media (max-width:760px){
 #tut{top:80px}
 #toasts{top:230px!important}
 #goals{display:none}
 #topbar{height:40px;gap:3px;padding:0 3px}
 #tb-country{min-width:0;padding:2px}#tb-country div{display:none}.flag.lg{width:34px;height:23px}
 #tb-time{min-width:62px}#tb-time b{font-size:11.5px}#tb-time small{font-size:10px}
 #tb-speed button{width:30px;height:32px;font-size:11px}
 #legend{left:48px;bottom:auto;top:84px}
 #tb-res{position:fixed;left:0;right:0;top:40px;height:36px;background:rgba(10,20,32,.93);padding:3px 4px;z-index:4;border-bottom:1px solid #223b55;flex:none}
 .rchip{min-width:62px;padding:1px 4px}
 .ibtn{width:30px;height:28px}
 #leftbar{top:76px;width:42px;padding:4px 2px}#leftbar button{width:38px;height:40px;font-size:17px}#leftbar button span{display:none}
 #mini-wrap{display:none!important}
 #prov-panel{left:42px;right:0;top:auto;bottom:0;width:auto;max-height:42%;border-radius:10px 10px 0 0}
 #unit-panel{left:42px;right:0;bottom:0;width:auto;min-width:0;border-radius:10px 10px 0 0}
 body.usel #prov-panel{display:none}
 #modal{width:100vw;height:100vh;max-height:none;border-radius:0}#modal.sm{width:96vw;height:auto;max-height:92vh;border-radius:8px}
 #toasts{top:80px;max-width:92%}
 #order-hint{top:80px;font-size:12px}
 .cols{min-width:900px}
 .stl,.str{width:100%}#start{flex-direction:column;overflow:auto;background:rgba(6,14,22,.55)}
 .stl{border-right:0;overflow:visible}.str{margin-left:0;border-left:0;overflow:visible}
 .clist{max-height:32vh}
 .title{font-size:24px}
}

/* Headquarters and accessibility */
body{font-size:var(--game-font,13px)}
body[data-theme=light]{--bg:#eef3f7;--bg2:#f7fafc;--bg3:#dce7ef;--tx:#172d43;--tx2:#425a70;--line:#9eb3c5;--ok:#21643a;--bad:#a92d23}
body[data-theme=military]{--bg:#172119;--bg2:#202d22;--bg3:#2a3b2b;--tx:#e3ead2;--tx2:#b0c09f;--line:#526249;--acc:#c8b76b}
.cx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px;margin:12px 0}
.cx-card{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-wrap:anywhere}
.cx-card h3{font-size:1.12em;margin:0 0 10px}.cx-card p{margin:8px 0}.cx-card .btn{margin:6px 5px 0 0}
.cx-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0}
.cx-fields label{display:flex;gap:8px;align-items:center;justify-content:space-between}.cx-fields input:not([type=checkbox]){max-width:110px}
.cx-table{overflow-x:auto}.cx-table .t{min-width:600px}.cx-danger{background:rgba(224,80,60,.17)}
.cx-chart{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.cx-chart svg{display:block;max-height:240px;width:100%}.cx-chart text{font:12px sans-serif;fill:var(--tx2)}
.cx-definition{padding:10px;border-bottom:1px solid var(--line)}.cx-definition summary{cursor:pointer;font-weight:600}
.cx-search-list{display:grid;gap:7px}.cx-search-list button{text-align:left;padding:12px;display:flex;justify-content:space-between;gap:12px}
.cx-search-list small{color:var(--tx2)}#cx-search,#cx-guide-search{width:100%;padding:12px;font-size:1.1em}
.cx-journal{padding-left:24px}.cx-journal li{padding:9px 0;border-bottom:1px solid var(--line)}.cx-journal time{color:var(--tx2)}
#campaign-bar{position:absolute;top:51px;left:74px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;z-index:3;max-width:calc(100% - 90px)}

/* Decodes the packed world data: arcs, adjacency graph, bounding boxes, per-country province lists */
(function () {
  const W = WORLD;
  const bin = atob(W.ap), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  let pos = 0;
  const rv = () => { let r = 0, sh = 0, c; do { c = b[pos++]; r |= (c & 127) << sh; sh += 7; } while (c & 128); return r >>> 0; };
  const zd = () => { const v = rv(); return (v >>> 1) ^ -(v & 1); };
  W.arcs = [];
  while (pos < b.length) {
    const l = rv() - 1, r = rv() - 1, cl = rv(), n = rv();
    const pts = new Int32Array(n * 2); let x = 0, y = 0;
    for (let i = 0; i < n; i++) { x += zd(); y += zd(); pts[2 * i] = x; pts[2 * i + 1] = y; }
    W.arcs.push([l, r, cl, pts]);
  }
  const P = W.provs.length;
  for (const p of W.provs) { p.adj = []; p.seas = []; }
  for (const s of W.seas) { s.adj = []; s.ports = []; }
  const add = (arr, v) => { if (arr.indexOf(v) < 0) arr.push(v); };
  const link = (a, b) => {
    if (a < P && b < P) { add(W.provs[a].adj, b); add(W.provs[b].adj, a); }
    else if (a >= P && b >= P) { add(W.seas[a - P].adj, b - P); add(W.seas[b - P].adj, a - P); }
    else { const p = a < P ? a : b, s = (a < P ? b : a) - P; add(W.provs[p].seas, s); add(W.seas[s].ports, p); }
  };
  for (const a of W.arcs) if (a[0] >= 0 && a[1] >= 0 && a[0] !== a[1]) link(a[0], a[1]);
  for (const [a, b] of W.links.land) link(a, b);
  for (const l of W.links.sea) { if (l.length === 3) link(l[0], l[1] + P); else link(l[0] + P, l[1] + P); }
  const abb = W.arcs.map(a => { let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1; const p = a[3]; for (let i = 0; i < p.length; i += 2) { if (p[i] < x0) x0 = p[i]; if (p[i] > x1) x1 = p[i]; if (p[i + 1] < y0) y0 = p[i + 1]; if (p[i + 1] > y1) y1 = p[i + 1]; } return [x0, y0, x1, y1]; });
  for (const r of W.provs.concat(W.seas)) {
    const bb = [1e9, 1e9, -1, -1];
    for (const ring of r.rings) for (const ai of ring) { const q = abb[ai >= 0 ? ai : ~ai]; if (q[0] < bb[0]) bb[0] = q[0]; if (q[1] < bb[1]) bb[1] = q[1]; if (q[2] > bb[2]) bb[2] = q[2]; if (q[3] > bb[3]) bb[3] = q[3]; }
    r.bbox = bb;
  }
  W.countries.forEach(c => { c.provs = []; });
  W.provs.forEach(p => W.countries[p.c].provs.push(p.id));
})();

function makeRng(seed) { let a = seed >>> 0; const f = function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; f.get = () => a; f.set = v => { a = v; }; return f; }

/* colors for countries: greedy graph colouring over palette */
const PALETTE = ['#5b8def', '#e0605a', '#58b368', '#e0b34a', '#a770d6', '#d9854a', '#4fb8c4', '#c9689a', '#8fb85a', '#7388c9', '#c4a05a', '#5aa58f', '#d06f6f', '#9a8ad0', '#b3b35a'];
function assignColors() {
  const nb = CTY.map(() => new Set());
  for (const p of PROV) for (const a of p.adj) if (PROV[a].c !== p.c) { nb[p.c].add(PROV[a].c); }
  const order = CTY.map((c, i) => i).sort((a, b) => nb[b].size - nb[a].size);
  const use = new Array(PALETTE.length).fill(0);
  const col = new Array(NC).fill(-1);
  for (const i of order) {
    const bad = new Set(); for (const j of nb[i]) if (col[j] >= 0) bad.add(col[j]);
    let best = -1, bu = 1e9;
    for (let k = 0; k < PALETTE.length; k++) if (!bad.has(k) && use[k] < bu) { bu = use[k]; best = k; }
    if (best < 0) best = i % PALETTE.length;
    col[i] = best; use[best]++;
  }
  return col.map(k => PALETTE[k]);
}

function unitAvail(c, t) { // can country c build unit type t (tech-wise)?

    case 'unloadtr': for (const id of SEL.units) { const u = G.U.get(id); if (u && u.t === 'transport' && u.loc < P) unloadAll(u, u.loc); else if (u && u.t === 'transport') toast('Подойдите к побережью (приказ в прибрежную провинцию — высадка автоматически)', 'war'); } renderUnitPanel(); break;
    case 'loadcar': {
      const cars = [...SEL.units].map(id => G.U.get(id)).filter(u => u && u.t === 'carrier'); let n = 0;
      for (const c of cars) n += loadOnCarrier(c.id, unitsAt(c.loc).filter(u => u.o === G.player && UNITS[u.t].dom === 'air' && u.st === 'base').map(u => u.id));

    }
    default: if (window.actModal) window.actModal(a, d, el, e);
  }
}

function doSave(n) {

/* ---------- modal actions ---------- */
window.actModal = function (a, d, el, e) {
  if (G?.opts.observer && ['dwar', 'dpeace', 'daccess', 'dgift', 'dinvite', 'djoin', 'dcreate', 'dleave', 'trade', 'research'].includes(a)) { toast('В режиме наблюдателя действует ИИ', 'war'); return; }
  switch (a) {
    case 'tab': UI.tab[d.m] = d.t; renderModal(false); break;
    case 'focus': if (+d.l >= 0) { closeModal(); focusLoc(+d.l, 3.2); if (+d.l < P) selectProv(+d.l); } break;
    case 'wsort': UI.wsort = d.s; renderModal(true); break;
    case 'research': { const err = startResearch(G.player, d.k, d.id, +d.l); if (err) toast(err, 'war'); else Snd.play('ok'); renderModal(true); break; }
    case 'selunitsT': { const ids = []; for (const [, u] of G.U) if (u.o === G.player && u.t === d.t) ids.push(u.id); closeModal(); selectUnits(ids, false); break; }
    case 'dsel': UI.warConfirm = -1; UI.dc = +d.c; UI.dmsg = ''; renderModal(true); break;
    case 'dfilter': UI.dfilter = d.f; renderModal(true); break;
    case 'dwar': {
      if (UI.warConfirm !== UI.dc) {
        const pw = previewWar(G.player, UI.dc); UI.warConfirm = UI.dc;
        dmsg(`Подтвердите объявление войны. Вероятно вступят ПРОТИВ вас: ${pw.against.map(m => G.C[m].n).join(', ') || 'никто'}. ЗА вас (возможно): ${pw.withUs.map(m => G.C[m].n).join(', ') || 'никто'}. Нажмите «Объявить войну» ещё раз.`, true); break;
      }
      UI.warConfirm = -1; const r = declareWar(G.player, UI.dc); if (r) dmsg(r, true); else { dmsg('Война объявлена!'); Snd.play('war'); } break;
    }
    case 'dpeace': { const r = proposePeace(G.player, UI.dc); if (r.ok) dmsg('Мир заключён!'); else dmsg(r.why || 'Отказ', true); break; }
    case 'daccess': { const r = requestAccess(G.player, UI.dc); dmsg(r.ok ? 'Доступ предоставлен — ваши войска могут проходить через их территорию' : r.why, !r.ok); break; }
    case 'dgift': { const res = $('giftres').value, q = +$('giftqty').value; if (giveGift(G.player, UI.dc, res, q)) dmsg('Подарок отправлен, отношения улучшились'); else dmsg('Не хватает ресурсов', true); break; }
    case 'dinvite': { const r = inviteToAlliance(G.player, UI.dc); dmsg(r.ok ? 'Страна вступила в ваш альянс!' : (r.why || 'Отказ'), !r.ok); break; }
    case 'djoin': {
      const c = G.C[UI.dc]; if (c.alliance < 0) { dmsg('Страна не состоит в альянсе', true); break; }
      const al = G.al[c.alliance]; let ok = relOf(G.player, c.id) >= 30; for (const m of al.members) if (G.war[G.player * NC + m]) ok = false;
      if (ok) { joinAlliance(G.player, al.id); dmsg('Вы вступили в альянс «' + al.n + '»'); } else dmsg('Альянс отклонил заявку (нужны отношения от +30 и мир со всеми членами)', true); break;
    }
    case 'dcreate': { const n = ($('alname').value || '').trim().slice(0, 30); createAlliance(G.player, n); renderModal(true); break; }
    case 'dleave': leaveAlliance(G.player); toast('Выход из альянса запланирован через 72 часа'); renderModal(true); break;
    case 'trade': { const err = trade(G.player, d.r, +d.q, d.b === '1'); if (err) toast(err, 'war'); else Snd.play('ok'); renderModal(true); break; }
    case 'save': doSave(+d.n); renderModal(true); break;
    case 'loadslot': if (doLoad('conww3_s' + d.n)) closeModal(); break;
    case 'tutgo': closeModal(); if (UI.tut < 0) { G.paused = false; G.speed = 2; } else G.speed = 2; updateSpeedBtns(); break;
    case 'optsound': UI.sound = el.checked; break;
    case 'optap': UI.autoPause = el.checked; break;
    case 'optdef': G.autoDef = el.checked; break;
    case 'optauto': G.autoBuy = el.checked; break;
    case 'opttut': UI.tutOff = !el.checked; UI.tut = el.checked ? 0 : -1; UI._tutH = ''; break;
    case 'optdn': MV.daynight = el.checked; MV.dirty = true; break;
    case 'optlabels': MV.labels = el.checked; MV.dirty = true; break;
    case 'optfog': G.fogOff = !el.checked; updateVis(true); MV.dirty = true; break;
    case 'newgame': if (UI.newConfirm) { UI.newConfirm = false; closeModal(); showStart(); } else { UI.newConfirm = true; el.textContent = '⚠ Нажмите ещё раз для подтверждения'; setTimeout(() => { UI.newConfirm = false; }, 4000); } break;
  }
};

'use strict';
/* ===== Start screen, game loop, boot ===== */
UI.start = { c: -1, scenario: 'cold', diff: 'easy', win: 25, doc: 'auto' };
let loopLast = 0, acc = 0, lastAutoHour = 0, overShown = false;

function importance(c) { return c.mil * 3 + Math.log10(c.gdp + 10) * 2 + (c.nukes ? 6 : 0); }
const FEATURED = ['US1', 'CH1', 'RUS', 'DEU', 'GB1', 'FR1', 'IND', 'TUR', 'JPN', 'BRA', 'POL', 'IS1', 'IRN', 'KOR', 'UKR', 'SAU', 'PAK', 'EGY', 'ITA', 'ESP', 'AU1', 'CAN', 'PRK', 'TWN'];
function diffRating(c) { const s = importance(c); return s > 40 ? ['Лёгкая', 1] : s > 26 ? ['Средняя', 2] : s > 16 ? ['Сложная', 3] : ['Экстремальная', 4]; }

function showStart() {
  document.body.classList.remove('quick-game');
  G = null; window.G_ = null; MV.sel = null; MV.mode = 'political'; MV.hoverP = -1; miniDirty = true; MV.fxs = [];
  $('hud').classList.add('hidden'); $('modal-back').classList.add('hidden'); $('start').classList.remove('hidden');
  $('mini-wrap').style.display = 'none';
  if (document.querySelector('.over')) document.querySelector('.over').remove();
  overShown = false; UI.modal = null; SEL.units.clear(); SEL.prov = SEL.sea = -1;
  MV.startHi = -1; MV.cam.z = minZoom() * 1.0001; clampCam(); MV.dirty = true;
  const order = CTY.map((c, i) => i).sort((a, b) => importance(CTY[b]) - importance(CTY[a]));

  if (PREF.roads && z > 2) {
    ctx.strokeStyle='rgba(232,221,178,.28)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
    for(const p of G.C[G.player].provs)if(G.pv[p].b.infra>=2)for(const n of ADJL[p])if(n>p && G.pv[n].o===G.player && G.pv[n].b.infra>=2){const[x,y]=w2s(lx(p),ly(p)),[a,b]=w2s(lx(n),ly(n));ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke();}
    ctx.setLineDash([]);
  }
  if (PREF.fronts || MV.mode === 'supply') {
    ctx.strokeStyle = '#ffb14e'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    for (const p of G.C[G.player].provs) for (const n of ADJL[p]) if (atWar(G.player, G.pv[n].o) && visible(n)) { const [x, y] = w2s(lx(p), ly(p)), [a, b] = w2s(lx(n), ly(n)); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(a, b); ctx.stroke(); }
    ctx.setLineDash([]);
  }
  const resource = MV.mode.startsWith('res:') ? MV.mode.slice(4) : null;
  let decorated = 0;
  if (z > 1.8) for (const p of PROV) {
    if (!visible(p.id)) continue;
    const [x, y] = w2s(p.x, p.y); if (!on(x, y)) continue;
    const pv = G.pv[p.id];
    if(PREF.clouds && !PREF.lowPower && weatherAt(p.id).move < 1 && p.id % 5 === 0){const drift=PREF.reduced?0:Math.sin(MV.now/5000+p.id)*8;ctx.fillStyle='rgba(190,210,225,.22)';ctx.beginPath();ctx.ellipse(x+drift,y-9,18,7,0,0,7);ctx.fill();}
    if (PREF.lights && MV.daynight !== false && isNight(p.id) && p.city > 100000 && pv.dmg < 60) { ctx.fillStyle = '#ffe6a2'; ctx.fillRect(x - 1, y - 1, 3, 3); }
    if (PREF.effects && !PREF.lowPower && pv.dmg > 35) { const rise = PREF.reduced ? 4 : (MV.now / 180 + p.id) % 12; ctx.fillStyle = 'rgba(220,110,50,.45)'; ctx.beginPath(); ctx.arc(x, y - rise, 3 + pv.dmg / 25, 0, 7); ctx.fill(); }
    if (resource) { const idx = { food: 0, comp: 1, fuel: 2, rare: 3, supp: 4, elec: 5 }[resource]; if (p.res[idx] >= 3) ctx.fillText(RES_INFO[resource].i, x, y + 14); }
    if (PREF.weather && !PREF.lowPower && p.id % 12 === 0 && decorated++ < 30) ctx.fillText(weatherAt(p.id).i, x + 18, y - 15);
  }
  if (PREF.effects && !PREF.lowPower) {
    let n = 0;
    for (const u of G.U.values()) {
      if (u.o !== G.player || !['out', 'back', 'move'].includes(u.st) || ++n > 70) continue;
      const [x, y] = w2s(...unitPos(u)); if (!on(x, y)) continue;
      ctx.strokeStyle = UNITS[u.t].dom === 'air' ? 'rgba(230,245,255,.5)' : 'rgba(220,190,120,.4)'; ctx.lineWidth = 1; const leg=u.leg || u.fl;const dx=leg ? leg.tx-leg.fx : 1, dy=leg ? leg.ty-leg.fy : 0, length=Math.hypot(dx,dy)||1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-dx/length*12,y-dy/length*12);ctx.stroke();
    }
  }
  ctx.restore();
}
window.addEventListener('load', applyPreferences);
document.addEventListener('keydown', e => {
  if (!UI.modal) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeModal(); return; }
  if (e.key !== 'Tab') return;
  const focusable = [...$('modal').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),summary')].filter(el => el.getClientRects().length);
  if (!focusable.length) return;
  const first = focusable[0], last = focusable.at(-1), active = document.activeElement;
  if (!focusable.includes(active) || e.shiftKey && active === first) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
  else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
}, true);

'use strict';
function quickUnitsHTML(us) {
  const land = us.some(u => ['land', 'sea'].includes(UNITS[u.t].dom)), air = us.some(u => UNITS[u.t].dom === 'air'), transport = us.some(u => u.t === 'transport');
  return `<div class="ph"><h3>🪖 Выбрано: ${us.length}<small>Прочность: ${Math.round(us.reduce((s, u) => s + u.hp, 0) / us.length)}%</small></h3><button class="x" data-act="desel">✕</button></div><div class="acts">${land ? '<button class="btn pri" data-act="mode" data-m="move">➜ Идти / атаковать</button><button class="btn" data-act="stop">Стоп</button>' : ''}${air ? '<button class="btn pri" data-act="mode" data-m="strike">💥 Удар</button><button class="btn" data-act="recall">↩ На базу</button>' : ''}${transport ? '<button class="btn" data-act="loadtr">Погрузить</button><button class="btn" data-act="unloadtr">Высадить</button>' : ''}</div>`;
}
function quickProvinceHTML(p) {
  const pv = G.pv[p], mine = pv.o === G.player;
  let h = `<div class="ph"><h3>${esc(PROV[p].name)}<small>${esc(G.C[pv.o].n)} · ★ ${PROV[p].vp}</small></h3><button class="x" data-act="closeprov">✕</button></div>`;
  if (mine) {
    h += '<div class="sec"><h4>Подкрепления</h4><div class="quick-recruits">';
    for (const t of ['inf', 'tank', 'fighter', 'frigate']) if (UNITS[t].dom !== 'sea' || isCoastal(p)) h += quickRecruitButton(p, t);
    h += '</div><details class="quick-extra-units"><summary>Другие войска</summary><div class="quick-recruits">' + ['recon','arty','bomber','transport'].filter(t => UNITS[t].dom !== 'sea' || isCoastal(p)).map(t => quickRecruitButton(p,t)).join('') + '</div></details>';
    if (pv.q.length) h += `<h4>Готовятся</h4>${pv.q.map((q, i) => `<div class="q">${UNITS[q.t].n}<b>${Math.ceil(q.left)} ч</b><button class="btn sm" data-act="cancelq" data-p="${p}" data-i="${i}" aria-label="Отменить заказ">✕</button></div>`).join('')}`;
    h += '</div><div class="sec"><h4>Постройки</h4><div class="row quick-builds">';
    for (const b of ['eco', 'barracks', 'factory', 'airfield', 'naval']) {
      if (b === 'naval' && !isCoastal(p)) continue;
      const err = canBuild(p, b);
      h += `<button class="btn" data-act="build" data-p="${p}" data-b="${b}" ${err ? 'disabled' : ''} title="${esc(err || costText(bldCost(b, pv.b[b] + 1)).replace(/<br>/g, ' · '))}">${BLD[b].i} ${b === 'eco' ? 'Доход' : BLD[b].n} ${pv.b[b] || ''} ＋</button>`;
    }
    if (pv.bq) h += `<p>🏗 ${BLD[pv.bq.b].n} · ${Math.ceil(pv.bq.left)} ч</p>`;
    h += '</div></div>';
  } else h += `<div class="sec"><button class="btn" data-act="dipl" data-c="${pv.o}">🤝 Дипломатия</button>${atWar(G.player, pv.o) ? `<button class="btn pri" data-act="quick-attack" data-p="${p}">⚔ Атаковать выбранными</button>` : '<p class="note">Для захвата сначала объявите войну в дипломатии.</p>'}</div>`;
  const own = unitsAt(p).filter(u => u.o === G.player);
  if (own.length) h += `<div class="sec"><button class="btn pri" data-act="selall" data-p="${p}">🪖 Выбрать войска (${own.length})</button><p class="note">Правый клик по цели — идти или атаковать. На телефоне — удерживайте цель пальцем.</p></div>`;
  if (pv.cap) h += `<div class="sec">⚔ Захват: ${Math.round(pv.cap.prog)}%</div>`;
  return h;
}

  return `<div class="cx-fields"><label><input type="checkbox" data-act="optsound" ${UI.sound ? 'checked' : ''}> Звук</label><label>Громкость <input type="range" data-cx-pref="volume" min="0" max="1" step="0.05" value="${PREF.volume}"></label><label>Размер текста <input type="number" data-cx-pref="font" min="12" max="20" value="${PREF.font}"></label><label><input type="checkbox" data-cx-pref="lowPower" ${PREF.lowPower ? 'checked' : ''}> Экономить батарею</label></div><p>Двигайте войска, захватывайте города и вызывайте подкрепления. Топливо, питание и снабжение обслуживаются автоматически.</p><p>Крылатые, баллистические и ядерные ракеты отключены для всех стран, включая ИИ.</p>`;

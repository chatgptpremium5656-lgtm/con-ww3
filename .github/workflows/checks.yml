name: Game checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simulation and migration tests
        run: node --test tools/campaign.test.js
      - name: Sixty-day simulation
        run: node tools/sim.js 60 POL
      - name: Verify committed bundle
        run: |
          NOMIN=1 node tools/build.js
          git diff --exit-code -- index.html
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser interaction tests
        run: python tools/browser_smoke.py
